packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false
  '@prisma/engines': true
  prisma: true

# Security fixes for packages that come in through other packages, kept within their major versions (see the
# 2026-10-25 security review): zod 4's oversized-collection memory use, fast-uri's scheme injection, mysql2's auth
# downgrade (mysql2 is in better-auth's adapters; this project uses Postgres)
overrides:
  "zod@>=4.0.0 <4.6.7": "^4.6.7"
  "fast-uri@>=3.0.0 <3.1.9": "^3.1.9"
  "mysql2@>=3.0.0 <3.23.1": "^3.23.1"
